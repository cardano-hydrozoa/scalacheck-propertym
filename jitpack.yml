# JitPack build config. Without this file JitPack builds with an old default JDK; a modern one is
# needed. `sbt publishM2` is JitPack's default sbt command, stated explicitly here so the build step
# is self-documenting. (JitPack runs `publishM2`, not `test`, so the `factor` demo is not exercised.)
jdk:
  - openjdk21
install:
  - sbt publishM2
